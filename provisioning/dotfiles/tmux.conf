# ~/.tmux.conf -- managed by data-tools/provisioning
set -g mouse on
# ...but 1 line per wheel notch instead of tmux's default 5, so scrolling isn't jumpy.
# (mouse on means iTerm2 selection needs option-drag; that's the tradeoff for
#  click-to-focus panes and drag-to-resize borders.)
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N1 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N1 scroll-down
set -g history-limit 50000
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
# Highlight the active window in the status bar
set-window-option -g window-status-current-style bg=#FF0000
